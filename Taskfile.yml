version: "3"

vars:
  SERVICE: "ima_service"
  PORT: "8000"
  SERVICE_APP: "{{.SERVICE}}/app"
  COV_TARGET: "{{.SERVICE}}"

tasks:
  # -------------------------
  # Guards
  # -------------------------
  ensure-service:
    desc: "Verify {{.SERVICE}} looks like a valid service (has {{.SERVICE}}/app)"
    preconditions:
      - sh: test -d {{.SERVICE_APP}}
        msg: |
          Service '{{.SERVICE}}' not found (missing '{{.SERVICE}}/app').
          Try one of: 'ima_service', 'tenant_service'.
          Example: task all SERVICE=ima_service

  # -------------------------
  # Dev servers
  # -------------------------
  start:
    desc: "Start a service (default: ima_service:8000)"
    deps: [ensure-service]
    cmds:
      - uv run uvicorn {{.SERVICE}}.main:app --reload --port {{.PORT}}

  start-all:
    desc: "Start all known services in parallel"
    cmds:
      - uv run uvicorn ima_service.main:app --reload --port 8000 &
      - uv run uvicorn tenant_service.main:app --reload --port 8001 &

  start-infra:
    desc: "Start infrastructure via docker-compose"
    cmds:
      - docker-compose -f infra/docker-compose.yml up -d

  start-docker:
    desc: "Start local docker-compose services"
    cmds:
      - docker-compose -f docker/docker-compose.yml up -d

  # -------------------------
  # Kill processes
  # -------------------------
  kill-port:
    desc: "Kill process on a given port (default: 8000)"
    vars:
      PORT: "8000"
    cmds:
      - lsof -ti:{{.PORT}} | xargs -r kill -9 || true

  kill-postgres:
    desc: "Kill any process running on port 5432"
    cmds:
      - lsof -ti:5432 | xargs -r kill -9 || true

  kill-all:
    desc: "Kill all relevant processes"
    cmds:
      - task: kill-port PORT=8000
      - task: kill-port PORT=8001
      - task: kill-postgres

  # -------------------------
  # Tests
  # -------------------------
  test:
    desc: "Run all tests for a service"
    deps: [ensure-service]
    cmds:
      - uv run pytest {{.SERVICE}}

  test-unit:
    desc: "Run unit tests for a service"
    deps: [ensure-service]
    cmds:
      - uv run pytest {{.SERVICE}}/app/tests/unit/

  test-integration:
    desc: "Run integration tests for a service"
    deps: [ensure-service]
    cmds:
      - uv run pytest {{.SERVICE}}/app/tests/integration/

  test-e2e:
    desc: "Run end-to-end tests for a service"
    deps: [ensure-service]
    cmds:
      - uv run pytest {{.SERVICE}}/tests/e2e/

  test-health:
    desc: "Run health tests for a service"
    deps: [ensure-service]
    cmds:
      - uv run pytest {{.SERVICE}}/app/tests/unit/test_health.py

  coverage:
    desc: "Run tests with coverage for a service"
    deps: [ensure-service]
    cmds:
      - uv run pytest --cov={{.COV_TARGET}} --cov-report=term-missing

  # -------------------------
  # Linting & Formatting
  # -------------------------
  lint:
    desc: "Lint with ruff (service)"
    deps: [ensure-service]
    cmds:
      - uv run ruff check {{.SERVICE_APP}}

  pylint:
    desc: "Lint with pylint (service)"
    deps: [ensure-service]
    cmds:
      - uv run pylint {{.SERVICE_APP}}

  lint-fix:
    desc: "Automatically fix lint issues with ruff (service)"
    deps: [ensure-service]
    cmds:
      - uv run ruff check {{.SERVICE_APP}} --fix

  format:
    desc: "Format code with black + isort (service)"
    deps: [ensure-service]
    cmds:
      - uv run black {{.SERVICE_APP}}
      - uv run isort {{.SERVICE_APP}}

  fix:
    desc: "Format + lint fix (service)"
    deps: [ensure-service]
    cmds:
      - uv run black {{.SERVICE_APP}}
      - uv run isort {{.SERVICE_APP}}
      - uv run ruff check {{.SERVICE_APP}} --fix

  typecheck:
    desc: "Type check with mypy (service)"
    deps: [ensure-service]
    cmds:
      - uv run mypy {{.SERVICE_APP}}

  # -------------------------
  # Repo-wide runners
  # -------------------------
  check-all:
    desc: "Run ruff, pylint, mypy on the whole repo"
    cmds:
      - uv run ruff check .
      - uv run pylint ima_service/app tenant_service/app || true
      - uv run mypy ima_service tenant_service

  test-all:
    desc: "Run all tests across repo"
    cmds:
      - uv run pytest

  qa:
    desc: "Full quality gate: format, lint, typecheck, tests"
    deps: [fix, check-all, test-all]

  # -------------------------
  # Pre-commit
  # -------------------------
  precommit-install:
    desc: "Install pre-commit git hooks"
    cmds:
      - uv run pre-commit install
      - uv run pre-commit install -t pre-push

  precommit-run:
    desc: "Run all pre-commit hooks on entire repo"
    cmds:
      - uv run pre-commit run --all-files

  precommit-ci:
    desc: "CI-style: run hooks, then full QA"
    deps: [precommit-run, qa]

  # -------------------------
  # Sanity checks
  # -------------------------
  sanity:
    desc: "Run service sanity script if present (assumes server is up)"
    deps: [ensure-service]
    vars:
      SCRIPT: "{{.SERVICE}}/scripts/sanity.sh"
    cmds:
      - |
        if [ -f "{{.SCRIPT}}" ]; then
          chmod +x "{{.SCRIPT}}" || true
          bash "{{.SCRIPT}}"
        else
          echo "No sanity script at {{.SCRIPT}} — skipping."
        fi

  # -------------------------
  # Cleanup
  # -------------------------
  clean:
    desc: "Remove caches and .pyc"
    cmds:
      - rm -rf .mypy_cache .pytest_cache .ruff_cache || true
      - find . -type d -name "__pycache__" -prune -exec rm -rf {} + || true
      - find . -type f -name "*.py[co]" -delete || true

  clean-hard:
    desc: "Aggressive clean (also node_modules, build, dist)"
    cmds:
      - task: clean
      - rm -rf build dist node_modules .coverage htmlcov || true

  # -------------------------
  # One-button: run EVERYTHING (service)
  # -------------------------
  all:
    desc: "Run format→fix→lint→pylint→typecheck→tests→coverage→pre-commit→sanity"
    deps: [ensure-service]
    cmds:
      - task: clean
      - task: fix
      - task: lint
      - task: pylint
      - task: typecheck
      - task: test
      - task: coverage
      - task: precommit-run
      - task: sanity


  # -------------------------
  # Docker / Compose
  # -------------------------
  docker-build:
    desc: "Build Docker image for a service (default: ima_service)"
    deps: [ensure-service]
    cmds:
      - |
        echo "Building Docker image for {{.SERVICE}}..."
        docker build \
          -f {{.SERVICE}}/infra/Dockerfile \
          -t {{.SERVICE}}:latest \
          {{.SERVICE}}

  docker-up:
    desc: "Start service + infra via docker-compose (uses {{.SERVICE}}/infra/docker-compose.yml)"
    deps: [ensure-service]
    cmds:
      - |
        echo "Starting {{.SERVICE}} via docker-compose..."
        docker compose -f {{.SERVICE}}/infra/docker-compose.yml up -d

  docker-down:
    desc: "Stop service + infra (docker-compose down)"
    deps: [ensure-service]
    cmds:
      - docker compose -f {{.SERVICE}}/infra/docker-compose.yml down

  docker-logs:
    desc: "Tail logs for the service container"
    deps: [ensure-service]
    cmds:
      - docker logs -f {{.SERVICE}}-app || true

  docker-restart:
    desc: "Restart service container"
    deps: [docker-down, docker-up]
