[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ima-service"
version = "0.1.0"
description = "MA auth/RBAC service (FastAPI, JWT, Redis, SQLModel)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.116.2",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.2.10",
    "psycopg-binary>=3.2.10",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.10.1",
    "redis>=6.4.0,<7.0.0", # <-- pinned to avoid resolver issues
    "sqlalchemy>=2.0.43",
    "sqlmodel>=0.0.25",
    "aiosqlite>=0.21.0",
    "alembic>=1.16.5",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.35.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["infra*", "migrations*"]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "isort>=6.0.1",
    "mypy>=1.18.2",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.13.1",
    "types-passlib>=1.7.7.20250602",
    "types-pyjwt>=1.7.1",
]

[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","W","I","C"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["ima_service/tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:'crypt' is deprecated:DeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20"
]

[tool.coverage.run]
source = ["ima_service"]
branch = true
omit = [
  "ima_service/main.py",
  "ima_service/tests/**",
]

[tool.pylint.MASTER]
init-hook = "import sys; from pathlib import Path; sys.path.append(str(Path().resolve()))"
max-line-length = 100
disable = [
    "C0301",
    "E0401",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
ignore = ["migrations", "__pycache__"]
