[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ima-service"
version = "0.1.0"
description = "IMA auth/RBAC service (FastAPI, JWT, Redis, SQLAlchemy, SQLModel)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",                     # Async PostgreSQL driver
    "fastapi[all]>=0.116.2",               # FastAPI with extras
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.2.10",
    "sqlalchemy>=2.0.43",
    "sqlmodel>=0.0.25",
    "aiosqlite>=0.21.0",
    "alembic>=1.16.5",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.35.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "colorama>=0.4.6",
    "redis>=6.4.0,<7.0.0",
    "types-python-jose>=3.5.0.20250531",
]

[tool.setuptools.packages.find]
include = ["ima_service*"]
exclude = ["infra*", "migrations*"]

[dependency-groups]
dev = [
    "aiohttp>=3.13.0",
    "black>=25.9.0",
    "isort>=6.0.1",
    "mypy>=1.18.2",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.13.1",
    "prometheus-client>=0.23.1",
    "types-passlib>=1.7.7.20250602",
    "types-pyjwt>=1.7.1",
    "sqlalchemy-stubs>=0.4",  # Helps mypy understand Mapped[]
    "pre-commit>=4.0.1",
]

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ima_service"]
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C"]
ignore = ["E501"]  # line length handled by black

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
follow_imports = "normal"
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
testpaths = ["ima_service/tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:'crypt' is deprecated:DeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20"
]

[tool.coverage.run]
source = ["ima_service"]
branch = true
omit = [
  "ima_service/main.py",
  "ima_service/tests/**",
]

[tool.pylint.MASTER]
init-hook = "import sys; from pathlib import Path; sys.path.append(str(Path().resolve()))"
max-line-length = 100
disable = [
    "C0301",  # line too long
    "E0401",  # import error (handle via PYTHONPATH)
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
ignore = ["migrations", "__pycache__"]
ignored-classes = ["Mapped", "func"]  # ✅ Fix for SQLAlchemy typing
