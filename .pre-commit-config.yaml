# .pre-commit-config.yaml
repos:
  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "v4.6.0"
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-json

  - repo: "https://github.com/astral-sh/ruff-pre-commit"
    rev: "v0.6.8"
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: "https://github.com/psf/black"
    rev: "24.8.0"
    hooks:
      - id: black

  - repo: "https://github.com/pre-commit/mirrors-mypy"
    rev: "v1.11.2"
    hooks:
      - id: mypy
        files: ^(ima_service/app)/
        additional_dependencies:
          - fastapi>=0.110
          - starlette>=0.37
          - sqlalchemy[mypy]>=2
          - redis>=5
          - pydantic>=2
          - pydantic-settings>=2
          - types-redis
        # mypy reads [tool.mypy] from pyproject.toml

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
        args:
          - ima_service/app
        pass_filenames: false
