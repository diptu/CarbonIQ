# ----------------------
# Root pyproject.toml (CarbonIQ Mono-Repo)
# ----------------------

[tool.uv.workspace]
members = [
    "ima_service",
    # "tenant_service", 
    #"shared_libs", 
    # "audit_observability"
    ]

[tool.uv.sources]
"ima_service" = { workspace = true }
# "tenant_service" = { workspace = true }
# "shared_libs" = { workspace = true }
# "audit_observability" = { workspace = true }

# ----------------------
# Dev Dependencies (shared across services)
# ----------------------
[dependency-groups]
dev = [
    "black>=24.10.0",
    "isort>=5.13.2",
    "mypy>=1.18.2",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.9",
]

# ----------------------
# Formatting / Linting
# ----------------------
[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
known_first_party = [
    "ima_service", 
     # "tenant_service",
     # "shared_libs", 
     # "audit_observability"
     ]
default_section = "THIRDPARTY"

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I", "C"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
packages = ["ima_service",
    # "tenant_service"
    ]

[tool.pytest.ini_options]
testpaths = ["ima_service/app/tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["ima_service"]
branch = true
omit = [
  "ima_service/main.py",
  "ima_service/**/tests/**",
]

[tool.pylint.MASTER]
init-hook = "import sys; from pathlib import Path; sys.path.append(str(Path().resolve()))"
max-line-length = 100
disable = [
    "C0301",   # line-too-long
    "E0401",   # import-error
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
ignore = ["migrations", "__pycache__"]
