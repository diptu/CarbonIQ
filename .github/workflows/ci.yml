name: CI (Lint • Typecheck • Test)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-checks:
    name: "${{ matrix.service }}: lint • typecheck • test"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ima_service
            app_path: app          # path that tools should check inside this service
            cov_target: ima_service  # module/package name used for coverage
          # - service: tenant_service
          #   app_path: app
          #   cov_target: tenant_service
          # Add more services here:
          # - service: another_service
          #   app_path: src
          #   cov_target: another_service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      # Cache per-service .venv using its uv.lock
      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: ${{ matrix.service }}/.venv
          key: ${{ runner.os }}-uv-${{ matrix.service }}-${{ hashFiles(format('{0}/uv.lock', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.service }}-

      - name: Install dependencies (dev)
        run: uv sync --frozen --group dev

      # -------- Lint --------
      - name: Ruff (lint)
        run: uv run ruff check ${{ matrix.app_path }}

      - name: Pylint
        run: uv run pylint ${{ matrix.app_path }}

      # -------- Typecheck --------
      - name: Mypy (typecheck)
        run: uv run mypy ${{ matrix.app_path }}

      # -------- Tests + Coverage --------
      - name: Pytest (with coverage)
        run: |
          uv run pytest \
            --maxfail=1 \
            --cov=${{ matrix.cov_target }} \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml

      - name: Upload test/coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/coverage.xml
            ${{ matrix.service }}/test-results.xml
          if-no-files-found: warn
          retention-days: 7

  # Optional: repo-wide pre-commit hooks after all services pass
  pre-commit:
    name: Pre-commit (repo-wide)
    runs-on: ubuntu-latest
    needs: [service-checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv + pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install uv pre-commit

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
