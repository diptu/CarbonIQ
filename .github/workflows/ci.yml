# .github/workflows/ci.yml
name: CI (Lint • Typecheck • Test)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-checks:
    name: "${{ matrix.service }}: lint • typecheck • test"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ima_service
            app_path: app            # path checked within service
            cov_target: ima_service  # package for coverage
          # - service: tenant_service
          #   app_path: app
          #   cov_target: tenant_service
          # Add more services here:
          # - service: another_service
          #   app_path: src
          #   cov_target: another_service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      # Cache a single workspace venv at repo root
      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-uv-venv-${{ hashFiles('uv.lock', 'ima_service/uv.lock', 'tenant_service/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-venv-

      - name: Install dependencies (workspace dev)
        run: uv sync --frozen --group dev

      # -------- Lint --------
      - name: Ruff (lint)
        run: uv run ruff check ${{ matrix.service }}/{{ matrix.app_path }}

      - name: Pylint
        run: uv run pylint ${{ matrix.service }}/{{ matrix.app_path }}

      # -------- Typecheck --------
      # Running from repo root so mypy sees root pyproject.toml.
      # (We pass the path explicitly to the service/app tree.)
      - name: Mypy (typecheck)
        run: uv run mypy ${{ matrix.service }}/{{ matrix.app_path }}

      # -------- Tests + Coverage --------
      - name: Pytest (with coverage)
        run: |
          uv run pytest \
            ${{ matrix.service }} \
            --maxfail=1 \
            --cov=${{ matrix.cov_target }} \
            --cov-report=xml:${{ matrix.service }}/coverage.xml \
            --cov-report=term-missing \
            --junitxml=${{ matrix.service }}/test-results.xml

      - name: Upload test/coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/coverage.xml
            ${{ matrix.service }}/test-results.xml
          if-no-files-found: warn
          retention-days: 7

  # Optional: repo-wide pre-commit after all services pass
  pre-commit:
    name: Pre-commit (repo-wide)
    runs-on: ubuntu-latest
    needs: [service-checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv + pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install uv pre-commit

      - name: Install dev deps for hooks
        run: uv sync --group dev

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
