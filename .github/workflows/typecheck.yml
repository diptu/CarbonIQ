name: Typecheck (mypy)

on:
  push:
    paths:
      - ".github/workflows/typecheck.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "ima_service/**"
  pull_request:
    paths:
      - ".github/workflows/typecheck.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "ima_service/**"
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: "${{ matrix.service }} • typecheck"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ima_service
            app_path: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-uv-venv-${{ hashFiles('uv.lock', 'ima_service/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-venv-

      - name: Install dependencies (prefer workspace; fallback to service)
        run: |
          set -euxo pipefail
          uv sync --frozen --group dev || \
          uv sync --frozen --group dev --project "${{ matrix.service }}"

      - name: Mypy
        run: |
          uv run mypy "${{ matrix.service }}/${{ matrix.app_path }}"
          # If each service has its own mypy config inside its pyproject.toml,
          # use:
          # uv run mypy --config-file "${{ matrix.service }}/pyproject.toml" \
          #             "${{ matrix.service }}/${{ matrix.app_path }}"
