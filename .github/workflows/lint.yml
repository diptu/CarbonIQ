name: Lint (Ruff • Pylint)

on:
  push:
    paths:
      - ".github/workflows/lint.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "ima_service/**"
  pull_request:
    paths:
      - ".github/workflows/lint.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "ima_service/**"
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "${{ matrix.service }} • lint"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ima_service
            app_path: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-uv-venv-${{ hashFiles('uv.lock', 'ima_service/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-venv-

      - name: Install dependencies (prefer workspace; fallback to service)
        run: |
          set -euxo pipefail
          uv sync --frozen --group dev || \
          uv sync --frozen --group dev --project "${{ matrix.service }}"

      - name: Ruff
        run: uv run ruff check "${{ matrix.service }}/${{ matrix.app_path }}"

      - name: Pylint
        run: uv run pylint "${{ matrix.service }}/${{ matrix.app_path }}"