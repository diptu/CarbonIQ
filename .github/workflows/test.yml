name: Tests (Pytest + Coverage)

on:
  push:
    paths:
      - ".github/workflows/test.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "ima_service/**"
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "ima_service/**"
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "${{ matrix.service }} • tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ima_service
            cov_target: ima_service  # Python package to measure coverage

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug — where am I?
        run: |
          set -euxo pipefail
          echo "== pwd ==" && pwd
          echo "== ls -la (repo root) ==" && ls -la
          echo "== ls -la service dir ==" && ls -la "${{ matrix.service }}"
          echo "== tests under service ==" && ls -la "${{ matrix.service }}/tests" || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-uv-venv-${{ hashFiles('uv.lock', 'ima_service/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-venv-

      - name: Install dependencies (prefer workspace; fallback to service)
        run: |
          set -euxo pipefail
          uv sync --frozen --group dev || \
          uv sync --frozen --group dev --project "${{ matrix.service }}"

      - name: Load test environment variables
        run: |
          echo "Loading .env.test for settings"
          # Remove comments to avoid errors in $GITHUB_ENV
          grep -v '^#' ima_service/.env.test >> $GITHUB_ENV

      - name: Pytest (with coverage)
        env:
          # Required environment variables for tests
          IMA_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SECRET_KEY: ${{ env.SECRET_KEY }}
          IMA_JWT__SECRET_KEY: ${{ env.SECRET_KEY }}
          IMA_REDIS_DSN: redis://localhost:6379/0
        run: |
          set -euxo pipefail
          uv run pytest \
            "${{ matrix.service }}/tests" \
            --maxfail=1 \
            --cov="${{ matrix.cov_target }}" \
            --cov-report=xml:"${{ matrix.service }}/coverage.xml" \
            --cov-report=term-missing \
            --junitxml="${{ matrix.service }}/test-results.xml"

      - name: Upload test/coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/coverage.xml
            ${{ matrix.service }}/test-results.xml
          if-no-files-found: warn
          retention-days: 7
